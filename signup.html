<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up · MongoNet</title>
<style>
:root{--bg:#0f1226;--c:#1a1f3d;--p:#6c5ce7;--t:#eef;--m:#9aa3d0}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#2a2468,var(--bg));color:var(--t);min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--c);border-radius:20px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 60px #0008}
h1{margin:0 0 6px;background:linear-gradient(90deg,#a29bfe,#74b9ff);-webkit-background-clip:text;color:transparent}p,small{color:var(--m)}
input{width:100%;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #333a66;background:#10142e;color:var(--t);font:inherit}
button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--p);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:6px}
.msg{min-height:22px;color:#ff7675}.msg.ok{color:#55efc4;font-weight:600}a{color:#74b9ff}
</style></head><body><div class="card"><h1>Sign up</h1><p>Create your account</p>
<input id="n" placeholder="Name (2-16 letters or numbers)"><input id="pw" type="password" placeholder="Password"><small>Password: 4-8 letters or numbers</small>
<div class="msg" id="e"></div><button id="b" onclick="go()">Create account</button><p style="text-align:center"><a href="index.html">← Back to log in</a></p></div>
<script>
async function go(){const n=document.getElementById('n').value.trim(),pw=document.getElementById('pw').value,e=document.getElementById('e');e.className='msg';
if(!/^[A-Za-z0-9_]{2,16}$/.test(n))return e.textContent='Name must be 2-16 letters or numbers';
if(!/^[A-Za-z0-9]{4,8}$/.test(pw))return e.textContent='Password must be 4-8 letters or numbers';
const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,password:pw})}),j=await r.json();
if(!r.ok)return e.textContent=j.error;
localStorage.t=j.token;document.getElementById('b').disabled=true;e.className='msg ok';e.textContent='✓ Account created successfully! Logging you in...';setTimeout(()=>location.href='index.html',1200)}
</script></body></html>
